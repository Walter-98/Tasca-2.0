name: Pubblica Tasca
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
        id: pages
      - name: Verifica configurazione
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Mancano le variabili Supabase. Segui docs/PUBBLICARE.md."
            exit 1
          fi
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_LOGIN: ${{ vars.VITE_GOOGLE_LOGIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Link per il telefono
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## Tasca è online" >> "$GITHUB_STEP_SUMMARY"
          echo "Apri [Tasca sul telefono]($APP_URL). Poi tocca Installa Tasca." >> "$GITHUB_STEP_SUMMARY"
